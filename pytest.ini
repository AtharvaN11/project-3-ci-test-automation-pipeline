[pytest]
# Where pytest looks for tests
testpaths = tests

# Options added to every run:
#   -v                 verbose output (one line per test)
#   --html=...         create an HTML report
#   --self-contained   put CSS inside the HTML so it is a single file
#   --junitxml=...     create an XML report (a standard format CI tools understand)
addopts = -v --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml

# Markers let us run groups of tests:  pytest -m api   or   pytest -m ui
markers =
    api: tests that call the REST API directly (fast, no browser)
    ui: tests that drive a real browser (slower)
    smoke: a tiny set of the most important checks
